<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background:#f4f4f2; color:#222; }
.view { display:none; }
.view.active { display:block; }

/* 顶部栏 */
.header { position:sticky; top:0; z-index:100; background:#fff; box-shadow:0 1px 6px rgba(0,0,0,.08); padding:14px 16px; }
.header h1 { font-size:17px; font-weight:700; letter-spacing:.5px; }
.header .sub { font-size:12px; color:#888; margin-top:3px; }
.back-btn { display:none; float:left; margin-right:10px; font-size:15px; line-height:22px; cursor:pointer; color:#333; padding:0 6px; }

/* 首页封面 */
.cover-wrap { padding:16px 16px 0; }
.cover-img { width:100%; border-radius:10px; display:block; cursor:pointer; }

/* 分类卡片 */
.cat-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; padding:16px; }
.cat-card { background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,.06); cursor:pointer; }
.cat-card img { width:100%; height:110px; object-fit:cover; display:block; }
.cat-card .cat-name { font-size:14px; font-weight:600; padding:9px 12px 4px; }
.cat-card .cat-count { font-size:11px; color:#999; padding:0 12px 10px; }

/* 二级：分类页商品网格 */
.series-header { padding:14px 16px 0; }
.series-header .series-title { font-size:18px; font-weight:700; }
.series-header .series-desc { font-size:12px; color:#888; margin-top:4px; }
.item-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; padding:14px 16px 20px; }
.item-card { background:#fff; border-radius:10px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,.06); cursor:pointer; }
.item-card img { width:100%; aspect-ratio:2560/1768; object-fit:cover; display:block; }
.item-card .item-name { font-size:13px; font-weight:600; padding:8px 10px 2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.item-card .item-desc { font-size:11px; color:#999; padding:0 10px 9px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* 三级：产品大图 */
.detail-wrap { padding:14px 16px 80px; }
.detail-img { width:100%; border-radius:10px; display:block; background:#fff; }
.detail-name { font-size:17px; font-weight:700; margin-top:14px; }
.detail-desc { font-size:13px; color:#666; margin-top:6px; line-height:1.6; }
.detail-tip { font-size:12px; color:#999; margin-top:10px; background:#fff; border-radius:8px; padding:10px 12px; }
.detail-tip b { color:#c0392b; }

/* 资质区 */
.about-wrap { padding:0 16px 24px; }
.about-title { font-size:16px; font-weight:700; margin:6px 0 12px; }
.about-img { width:100%; border-radius:10px; display:block; cursor:pointer; margin-bottom:10px; }

/* 底部咨询 */
.footer-bar { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid #eee; display:flex; padding:8px 12px calc(8px + env(safe-area-inset-bottom)); gap:10px; z-index:100; }
.footer-bar a { flex:1; text-align:center; padding:11px 0; border-radius:8px; font-size:14px; font-weight:600; text-decoration:none; }
.btn-call { background:#222; color:#fff; }
.btn-wechat { background:#07c160; color:#fff; }
.foot-text { text-align:center; font-size:11px; color:#bbb; padding:14px 0 70px; }

/* 大图弹层（支持缩放） */
.lightbox { position:fixed; inset:0; background:rgba(0,0,0,.96); z-index:200; display:none; justify-content:center; align-items:center; flex-direction:column; overflow:hidden; }
.lightbox.show { display:flex; }
.lightbox .lb-stage { width:100%; height:100%; display:flex; justify-content:center; align-items:center; position:relative; touch-action:none; }
.lightbox img { max-width:96%; max-height:90vh; border-radius:6px; transform-origin:center center; transition:transform .18s ease; -webkit-user-select:none; user-select:none; }
.lightbox .lb-name { color:#fff; font-size:14px; margin-top:8px; padding:0 20px; text-align:center; position:absolute; bottom:44px; left:0; right:0; }
.lightbox .lb-tip { color:#aaa; font-size:12px; margin-top:6px; position:absolute; bottom:14px; left:0; right:0; text-align:center; }
.lightbox .lb-close { position:absolute; top:10px; right:14px; color:#fff; font-size:26px; cursor:pointer; padding:8px; z-index:10; }
</style>
</head>

var $ = function(id){ return document.getElementById(id); };
var state = { cat:null, idx:null };

function showHome(){
  ["view-home","view-series","view-item"].forEach(function(v){ $(v).classList.remove("active"); });
  $("view-home").classList.add("active");
  $("back-series").style.display="none";
  $("back-item").style.display="none";
  $("footer-bar") ? null : null;
  document.querySelector(".footer-bar").style.display="flex";
  window.scrollTo(0,0);
}
function showSeries(catId){
  var c = CATS.find(function(x){ return x.id===catId; });
  if(!c) return;
  state.cat = catId;
  ["view-home","view-series","view-item"].forEach(function(v){ $(v).classList.remove("active"); });
  $("view-series").classList.add("active");
  $("back-series").style.display="inline";
  $("back-item").style.display="none";
  document.querySelector(".footer-bar").style.display="flex";
  $("series-title").textContent = c.name + "（" + c.items.length + "款）";
  $("series-desc").textContent = c.desc;
  var html = "";
  c.items.forEach(function(it,i){
    html += '<div class="item-card" onclick="showItem('+i+')">'
      + '<img loading="lazy" src="'+it.img+'" alt="'+it.name+'">'
      + '<div class="item-name">'+it.name+'</div>'
      + '<div class="item-desc">'+it.desc+'</div></div>';
  });
  $("item-grid").innerHTML = html;
  window.scrollTo(0,0);
}
function showItem(idx){
  var c = CATS.find(function(x){ return x.id===state.cat; });
  if(!c || !c.items[idx]) return;
  state.idx = idx;
  var it = c.items[idx];
  ["view-home","view-series","view-item"].forEach(function(v){ $(v).classList.remove("active"); });
  $("view-item").classList.add("active");
  $("back-item").style.display="inline";
  document.querySelector(".footer-bar").style.display="flex";
  $("item-title").textContent = c.name;
  $("detail-img").src = it.img;
  $("detail-img").onclick = function(){ openLightbox(it.img, it.name); };
  $("detail-name").textContent = it.name;
  $("detail-desc").textContent = it.desc;
  window.scrollTo(0,0);
}

/* ===== 大图缩放（单击放大/还原，双指缩放，拖动平移） ===== */
var lb = { scale:1, tx:0, ty:0, pinch:0, moving:false, sx:0, sy:0, st:0 };
function lbApply(){
  var img = $("lb-img");
  img.style.transition = "transform .18s ease";
  img.style.transform = "translate("+lb.tx+"px,"+lb.ty+"px) scale("+lb.scale+")";
}
function lbReset(){
  lb.scale = 1; lb.tx = 0; lb.ty = 0; lbApply();
}
function lbZoom(scale, cx, cy){
  var img = $("lb-img");
  var r = img.getBoundingClientRect();
  // 相对图片中心的缩放锚点
  var pcx = (cx - (r.left + r.width/2)) / lb.scale;
  var pcy = (cy - (r.top + r.height/2)) / lb.scale;
  lb.scale = Math.max(1, Math.min(5, scale));
  lb.tx = (cx - r.left - r.width/2) - pcx * lb.scale;
  lb.ty = (cy - r.top - r.height/2) - pcy * lb.scale;
  lbApply();
}
function openLightbox(img, name){
  $("lb-img").src = img;
  $("lb-name").textContent = name || "";
  $("lightbox").classList.add("show");
  lbReset();
}
function closeLightbox(){ $("lightbox").classList.remove("show"); lbReset(); }

(function(){
  var stage = $("lb-stage"), img = $("lb-img");
  var t0 = null, dist0 = 0, lastScale = 1, lastTx = 0, lastTy = 0;

  stage.addEventListener("touchstart", function(e){
    e.preventDefault();
    if(e.touches.length === 1){
      t0 = { x:e.touches[0].clientX, y:e.touches[0].clientY, t:Date.now() };
      lastTx = lb.tx; lastTy = lb.ty; lb.moving = false;
    } else if(e.touches.length === 2){
      t0 = null;
      var dx = e.touches[0].clientX - e.touches[1].clientX;
      var dy = e.touches[0].clientY - e.touches[1].clientY;
      dist0 = Math.sqrt(dx*dx + dy*dy);
      lastScale = lb.scale;
      lb.pinch = 1;
      img.style.transition = "none";
    }
  }, {passive:false});

  stage.addEventListener("touchmove", function(e){
    e.preventDefault();
    if(e.touches.length === 2){
      var dx = e.touches[0].clientX - e.touches[1].clientX;
      var dy = e.touches[0].clientY - e.touches[1].clientY;
      var d = Math.sqrt(dx*dx + dy*dy);
      if(dist0 > 0){
        var ns = lastScale * (d / dist0);
        ns = Math.max(1, Math.min(5, ns));
        lb.scale = ns; lbApply(); img.style.transition = "none";
      }
      lb.pinch = 1;
    } else if(e.touches.length === 1){
      if(lb.pinch){ // 双指结束后单指拖动
        lb.pinch = 0; lastTx = lb.tx; lastTy = lb.ty;
        t0 = { x:e.touches[0].clientX, y:e.touches[0].clientY, t:Date.now() };
      }
      if(t0){
        var nx = e.touches[0].clientX - t0.x;
        var ny = e.touches[0].clientY - t0.y;
        if(Math.abs(nx) > 6 || Math.abs(ny) > 6) lb.moving = true;
        if(lb.scale > 1){
          lb.tx = lastTx + nx; lb.ty = lastTy + ny;
          lbApply();
        }
      }
    }
  }, {passive:false});

  stage.addEventListener("touchend", function(e){
    if(e.touches.length === 0 && t0 && !lb.moving && lb.pinch === 0){
      // 单击：放大/还原
      if(Date.now() - t0.t < 350){
        if(lb.scale > 1.05){ lbReset(); }
        else { lbZoom(2.6, t0.x, t0.y); }
      }
    }
    if(e.touches.length === 0){ t0 = null; lb.pinch = 0; }
  });

  stage.addEventListener("dblclick", function(e){
    if(lb.scale > 1.05){ lbReset(); }
    else { lbZoom(2.6, e.clientX, e.clientY); }
  });
})();

function route(){
  var h = location.hash || "#/";
  var parts = h.replace(/^#\//,"").split("/");
  if(parts[0] && CATS.find(function(x){return x.id===parts[0];})){
    if(parts[1] !== undefined){
      state.cat = parts[0];
      showItem(parseInt(parts[1],10));
    } else {
      showSeries(parts[0]);
    }
  } else {
    showHome();
  }
}

function init(){
  $("h-brand").textContent = CONFIG.brand;
  $("h-sub").textContent = CONFIG.brandSub;
  $("foot-text").textContent = CONFIG.foot;
  $("btn-call").href = CONFIG.phoneLink;
  $("btn-call").textContent = "电话 " + CONFIG.phone;
  $("btn-wechat").textContent = "微信 " + CONFIG.wechat;
  $("btn-wechat").href = "weixin://";

  $("cover-img").src = COVER;
  $("cover-img").onclick = function(){ openLightbox(COVER, CONFIG.brand); };
  $("about-img").src = ABOUT;
  $("about-img").onclick = function(){ openLightbox(ABOUT, "品牌资质"); };

  var html = "";
  CATS.forEach(function(c){
    html += '<div class="cat-card" onclick="location.hash=\'#/'+c.id+'\'">'
      + '<img loading="lazy" src="'+c.cover+'" alt="'+c.name+'">'
      + '<div class="cat-name">'+c.name+'</div>'
      + '<div class="cat-count">'+c.count+'</div></div>';
  });
  $("cat-grid").innerHTML = html;

  $("back-series").onclick = function(){ location.hash = "#/"; };
  $("back-item").onclick = function(){ location.hash = "#/"+state.cat; };
  $("lb-close").onclick = closeLightbox;
  $("lb-stage").onclick = function(e){ if(e.target===this || e.target.id==="lb-stage") closeLightbox(); };

  window.addEventListener("hashchange", route);
  route();
}
init();
</script>
