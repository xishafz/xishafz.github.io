  <div class="lb-stage" id="lb-stage"><img id="lb-img" alt="大图"></div>
  <div class="lb-name" id="lb-name"></div>
  <div class="lb-tip">单击图片放大/还原 · 双指缩放 · 拖动查看细节 · 长按可保存</div>
</div>
<div class="contact-pop" id="contact-pop">
  <div class="cp-box">
    <img id="contact-qr" alt="微信二维码">
    <div class="cp-wx" id="contact-wx"></div>
    <div class="cp-tip">长按二维码识别，或长按微信号复制</div>
    <span class="cp-close" id="cp-close">关闭</span>
  </div>
</div>
<div class="back-top" id="back-top" title="返回顶部">↑</div>
<div class="tabbar" id="tabbar">
  <div class="tab" id="tab-home" onclick="location.hash='#/'"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 3.2 3.4 10.6v9.4a.9.9 0 0 0 .9.9h4.9v-6h5.6v6h4.9a.9.9 0 0 0 .9-.9v-9.4z"/></svg><span>首页</span></div>
  <div class="tab" id="tab-cat" onclick="goAllNav()"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M4.5 4.5h6v6h-6zM13.5 4.5h6v6h-6zM4.5 13.5h6v6h-6zM13.5 13.5h6v6h-6z"/></svg><span>分类</span></div>
  <div class="tab" id="tab-fav" onclick="location.hash='#/fav'"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 21s-7.5-4.6-9.7-9.2C.5 8.4 2.4 4.8 6 4.8c2 0 3.3 1 4.2 2.3h3.6C14.7 5.8 16 4.8 18 4.8c3.6 0 5.5 3.6 3.7 7C19.5 16.4 12 21 12 21z"/></svg><span>收藏</span></div>
</div>
<div class="fav-tip" id="fav-tip"></div>
<script>
var $ = function(id){ return document.getElementById(id); };
var state = { path: [], idx: null, detailIdx: 0, prevHash: "", curHash: "" };
var PLACEHOLDER = "data:image/svg+xml;charset=utf-8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="600" height="450"><rect width="100%" height="100%" fill="#e6e6e2"/><text x="50%" y="50%" font-size="26" fill="#aaa" text-anchor="middle" dominant-baseline="middle">暂无图片</text></svg>');
function findNode(ids){
  var arr = CATS;
  var node = null;
  for(var i=0;i<ids.length;i++){
    node = arr.find(function(x){ return x.id===ids[i]; });
    if(!node) return null;
    arr = node.children || [];
  }
  return node;
}
function countItems(node){
  var c = (node.items||[]).length;
  (node.children||[]).forEach(function(ch){ c += countItems(ch); });
  return c;
}
function itemImg(it){ var u = (it.imgs && it.imgs[0]) || it.img || ""; return u || PLACEHOLDER; }
function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function setView(v){ ["view-home","view-list","view-all","view-item","view-search","view-fav"].forEach(function(x){ $(x).classList.remove("active"); }); $(v).classList.add("active"); window.scrollTo(0,0); }
/* ---- 首页 ---- */
var sw = { idx:0, timer:null, startX:0 };
function swGo(i){
  if(!COVERS.length) return;
  sw.idx = (i + COVERS.length) % COVERS.length;
  $("swiper-track").style.transform = "translateX(-" + (sw.idx*100) + "%)";
  var dots = $("swiper-dots").children;
  for(var j=0;j<dots.length;j++){ dots[j].className = (j===sw.idx) ? "on" : ""; }
}
function swStart(){ if(sw.timer) clearInterval(sw.timer); if(COVERS.length>1) sw.timer = setInterval(function(){ swGo(sw.idx+1); }, 3500); }
function swBtnVisible(){
  var show = COVERS.length > 1;
  $("sw-prev").style.display = show ? "flex" : "none";
  $("sw-next").style.display = show ? "flex" : "none";
}
function coverUrl(u){ return (typeof u === "object") ? (u.url || "") : u; }
/* 联系方式栏（电话/微信，后台可配置，留空不显示） */
function contactHtml(){
  var c = CONTACT || {};
  var h = "";
  if(c.phone){ h += '<a class="c-item tel" href="tel:'+esc(String(c.phone).replace(/[^0-9+\- ]/g,""))+'">电话 '+esc(c.phone)+'</a>'; }
  if(c.wechat){ h += '<span class="c-item" id="c-wechat">微信 '+esc(c.wechat)+'</span>'; }
  return h;
}
function renderContact(where){
  var h = contactHtml();
  $(where).innerHTML = h;
  $(where).style.display = h ? "flex" : "none";
}
document.addEventListener("click", function(e){
  var t = e.target;
  if(t.id === "c-wechat"){
    var c = CONTACT || {};
    if(c.qr){ $("contact-qr").src = c.qr; $("contact-qr").style.display = "block"; }
    else { $("contact-qr").style.display = "none"; }
    $("contact-wx").textContent = "微信号：" + (c.wechat || "");
    $("contact-pop").style.display = "flex";
  }
  if(t.id === "cp-close" || t.id === "contact-pop"){ $("contact-pop").style.display = "none"; }
});
/* 首页分类方块（后台 homeQuick 配置；名称或分类为空则前台不显示） */
function renderQuick(){
  var wrap = $("quick-wrap");
  if(!wrap) return;
  var qs = (DATA.homeQuick || []).filter(function(q){ return q && (q.name || "").trim() && (q.cat || "").trim(); });
  if(!qs.length){ wrap.style.display = "none"; wrap.innerHTML = ""; return; }
  var h = "";
  qs.forEach(function(q){
    var img = q.img || "";
    if(!img){ var qn = findNode(q.cat.split("/")); if(qn) img = firstImg(qn); }
    h += '<div class="quick-item" onclick="goNavCat(\'' + q.cat + '\')">'
      + (img ? '<img loading="lazy" src="' + img + '" alt="">' : '<div class="qi-noimg"></div>')
      + '<div class="qi-name">' + esc(q.name) + '</div></div>';
  });
  wrap.style.display = "block";
  wrap.innerHTML = '<div class="quick-grid">' + h + '</div>';
}
function showHome(){
  setView("view-home");
  state.path = []; state.idx = null;
  $("h-brand").textContent = CONFIG.brand || "产品手册";
  $("h-sub").textContent = CONFIG.brandSub || "";
  $("foot-text").textContent = CONFIG.foot || "";
  var track = "";
  COVERS.forEach(function(u){ track += '<img loading="lazy" src="'+coverUrl(u)+'" alt="封面">'; });
  $("swiper-track").innerHTML = track;
  var dots = "";
  for(var i=0;i<COVERS.length;i++){ dots += '<i'+(i===0?" class=\"on\"":"")+'></i>'; }
  $("swiper-dots").innerHTML = dots;
  $("swiper-track").style.transform = "translateX(0)";
  sw.idx = 0; swStart(); swBtnVisible();
  /* 点击轮播图：跳转到该图配置的链接；没配置则进全部产品导航 */
  $("swiper-track").onclick = function(){
    var c = COVERS[sw.idx];
    var link = (typeof c === "object" && c.link) ? c.link : "";
    if(link){ location.hash = link; }
    else { location.hash = "#/all"; }
  };
  renderQuick();
  var html = "";
  CATS.forEach(function(c){
    html += '<div class="cat-card" onclick="goNavCat(\''+c.id+'\')">'
      + '<img loading="lazy" src="'+firstImg(c)+'" alt="'+esc(c.name)+'">'
      + '<div class="cat-name">'+esc(c.name)+'</div>'
      + '<div class="cat-count">共'+countItems(c)+'款</div></div>';
  });
  $("cat-grid").innerHTML = html;
  /* 资质页（可编辑标题/正文/图） */
  var ab = (ABOUT && typeof ABOUT === "object") ? ABOUT : { title:"品牌资质", text:"", img: ABOUT || "" };
  $("about-title").textContent = ab.title || "品牌资质";
  $("about-text").textContent = ab.text || "";
  if(ab.img){ $("about-img").src = ab.img; $("about-img").style.display = "block"; $("about-img").onclick = function(){ openLightbox(ab.img, "品牌资质"); }; }
  else { $("about-img").style.display = "none"; }
  renderContact("home-contact");
  $("back-item").style.display="none";
  $("back-all").style.display="none";
  /* 搜索框：回车进入结果页；输入时实时预览 */
  $("search-box").value = "";
  $("search-res").style.display = "none";
  $("search-box").onkeydown = function(e){
    if(e.key === "Enter"){
      var q = this.value.trim();
      if(q) location.hash = "#/search/" + encodeURIComponent(q);
    }
  };
  $("search-box").oninput = function(){
    var q = this.value.trim();
    var box = $("search-res");
    if(!q){ box.style.display = "none"; return; }
    var out = [];
    (function walk(list, path){
      list.forEach(function(n){
        var p = path + "/" + n.id;
        if((n.name||"").indexOf(q) >= 0){ out.push({ name: n.name + "（分类）", hash: "#/" + p, img: firstImg(n) }); }
        (n.items||[]).forEach(function(it, i){
          var hay = (it.name||"") + " " + (it.desc||"") + " " + (it.points||[]).join(" ");
          if(hay.indexOf(q) >= 0){
            out.push({ name: it.name, hash: "#/" + p + "/" + i, img: itemImg(it) });
          }
        });
        if(n.children) walk(n.children, p);
      });
    })(CATS, "");
    var rh = "";
    out.slice(0, 20).forEach(function(r){
      rh += '<div class="sr-row" onclick="location.hash=\''+r.hash+'\'">'+ '<img loading="lazy" src="'+r.img+'" alt="">' + '<span class="sr-name">'+esc(r.name)+'</span></div>';
    });
    if(out.length > 20){
      rh += '<div class="sr-row" onclick="location.hash=\'#/search/\'+encodeURIComponent(\''+q+'\')"><span class="sr-name" style="color:#e8590c;font-weight:600;">查看全部 '+out.length+' 个结果 ›</span></div>';
    }
    box.innerHTML = rh || '<div class="sr-empty">没有找到相关产品，按回车查看结果页</div>';
    box.style.display = "block";
  };
}
function firstImg(node){
  var u = "";
  if(node.cover) u = node.cover;
  else if(node.items && node.items[0]) u = itemImg(node.items[0]);
  else if(node.children && node.children[0]) u = firstImg(node.children[0]);
  return u || PLACEHOLDER;
}
/* ---- 分类页 ---- */
function showList(ids){
  var node = findNode(ids);
  if(!node) return;
  state.path = ids; state.idx = null;
  setView("view-list");
  $("list-title").textContent = node.name + "（共" + countItems(node) + "款）";
  $("list-desc").textContent = node.desc || "";
  $("back-list").style.display = ids.length ? "inline" : "none";
  $("back-list").onclick = function(){
    var p = ids.slice(0, -1);
    location.hash = "#/" + p.join("/");
  };
  var html = "";
  /* 二级分类卡片与一级直挂款式同时显示：先分类，后款式 */
  (node.children||[]).forEach(function(ch){
    html += '<div class="grid-card" onclick="location.hash=\'#/'+ids.concat([ch.id]).join("/")+'\'">'
      + '<img loading="lazy" src="'+firstImg(ch)+'" alt="'+esc(ch.name)+'">'
      + '<div class="gc-name">'+esc(ch.name)+'</div>'
      + '<div class="gc-desc">共'+countItems(ch)+'款</div></div>';
  });
  (node.items||[]).forEach(function(it,i){
    html += '<div class="grid-card" onclick="location.hash=\'#/'+ids.concat([i]).join("/")+'\'">'
      + '<img loading="lazy" src="'+itemImg(it)+'" alt="'+esc(it.name)+'">'
      + '<div class="gc-name">'+esc(it.name)+'</div>'
      + '<div class="gc-desc">'+esc(it.desc)+'</div>'
      + ((it.fabric && String(it.fabric).trim()) ? '<div class="gc-fabric">成分：' + esc(it.fabric) + '</div>' : "")
      + '</div>';
  });
  $("grid").innerHTML = html;
  $("back-item").style.display="none";
  $("back-all").style.display="none";
}
/* ---- 全部产品导航页（左栏固定 + 树形展开收起 + 单列卡片） ---- */
var navState = { path: "all", q: "", open: {} };
function navCollect(node, pathStr, out){
  (node.items||[]).forEach(function(it, i){ out.push({ it: it, hash: "#/" + pathStr + "/" + i }); });
  (node.children||[]).forEach(function(ch){ navCollect(ch, pathStr + "/" + ch.id, out); });
  return out;
}
function navItems(){
  var out = [];
  if(navState.path === "all"){ CATS.forEach(function(c){ navCollect(c, c.id, out); }); }
  else {
    var node = findNode(navState.path.split("/"));
    if(node) navCollect(node, navState.path, out);
  }
  return out;
}
function navPick(p, toggle){
  var node = findNode(p.split("/"));
  var hasCh = node && node.children && node.children.length;
  if(hasCh){
    if(toggle){ navState.open[p] = !navState.open[p]; }
    else if(!navState.open[p]){ navState.open[p] = true; }
  }
  navState.path = p; navState.q = "";
  $("nav-search").value = "";
  renderNavSide();
  renderNavGrid();
}
function renderNavSide(){
  var h = '<div class="ns-item' + (navState.path === "all" ? " on" : "") + '" data-nav="all">全部</div>';
  (function walk(list, prefix, lv){
    list.forEach(function(c){
      var p = prefix ? prefix + "/" + c.id : c.id;
      var hasCh = c.children && c.children.length;
      var on = navState.path === p;
      var open = !!navState.open[p];
      h += '<div class="ns-item' + (lv ? " lv" + Math.min(lv + 1, 3) : "") + (on ? " on" : "") + '"'
        + ' data-nav="' + p + '"' + (hasCh ? ' data-toggle="1"' : "") + '>'
        + (hasCh ? '<span class="ns-arrow">' + (open ? "▾" : "▸") + '</span>' : "")
        + esc(c.name) + '</div>';
      if(hasCh && open) walk(c.children, p, lv + 1);
    });
  })(CATS, "", 0);
  $("nav-side").innerHTML = h;
}
function renderNavGrid(){
  var items = navItems();
  var q = navState.q;
  if(q){
    items = items.filter(function(o){
      var it = o.it;
      return ((it.name||"") + " " + (it.desc||"") + " " + (it.points||[]).join(" ")).indexOf(q) >= 0;
    });
  }
  var h = "";
  items.forEach(function(o){
    var it = o.it;
    var m = (it.name||"").match(/#\S+/);
    var name = m ? (it.name||"").replace(m[0], "").trim() : (it.name||"");
    var no = m ? m[0] : "";
    h += '<div class="n-card" onclick="location.hash=\'' + o.hash + '\'">'
      + '<img loading="lazy" src="' + itemImg(it) + '" alt="">'
      + '<div class="n-info">'
      + '<div class="n-name">' + esc(name) + '</div>'
      + (no ? '<div class="n-no">' + esc(no) + '</div>' : "")
      + (it.desc ? '<div class="n-desc">' + esc(it.desc) + '</div>' : "")
      + ((it.fabric && String(it.fabric).trim()) ? '<div class="n-fabric">成分：' + esc(it.fabric) + '</div>' : "")
      + '</div></div>';
  });
  $("nav-grid").innerHTML = h || '<div class="nav-empty">没有找到相关产品</div>';
}
function showAll(){
  setView("view-all");
  $("back-all").style.display = "inline";
  $("back-all").onclick = function(){ location.hash = "#/"; };
  $("back-item").style.display="none";
  $("back-list").style.display="none";
  $("nav-search").value = navState.q;
  $("nav-search").oninput = function(){ navState.q = this.value.trim(); renderNavGrid(); };
  $("nav-search").onkeydown = function(e){ if(e.key === "Enter"){ navState.q = this.value.trim(); renderNavGrid(); } };
  renderNavSide();
  renderNavGrid();
  /* 左类目点击（事件委托：有子类目的点一下展开/收起，叶子点一下选中） */
  $("nav-side").onclick = function(e){
    var t = e.target;
    while(t && t !== this && !t.getAttribute("data-nav")) t = t.parentNode;
    if(t && t.getAttribute("data-nav")) navPick(t.getAttribute("data-nav"), !!t.getAttribute("data-toggle"));
  };
}
/* 从首页入口 / 底部“分类”按钮进入：重置为“全部”，从详情返回时则保留进入前的分类 */
function goAllNav(){
  navState.path = "all"; navState.q = ""; navState.open = {};
  location.hash = "#/all";
}
/* 首页分类卡片点击：进入导航页并定位到该分类标签（自动展开其子分类） */
function goNavCat(cid){
  navState.path = cid; navState.q = ""; navState.open = {};
  var node = findNode(cid.split("/"));
  if(node && node.children && node.children.length){ navState.open[cid] = true; }
  location.hash = "#/all";
}
/* ---- 款式详情（1:1主图轮播 + 说明点 + 图文详情） ---- */
var mi = { idx: 0, total: 0 };
function miGo(i){
  var n = mi.total;
  if(!n) return;
  mi.idx = (i + n) % n;
  $("mimg-track").style.transform = "translateX(-" + (mi.idx*100) + "%)";
  var ds = $("mimg-dots").children;
  for(var j=0;j<ds.length;j++){ ds[j].className = (j===mi.idx) ? "on" : ""; }
}
function showItem(ids, idx){
  var node = findNode(ids);
  if(!node || !node.items || !node.items[idx]) return;
  state.path = ids; state.idx = idx;
  var it = node.items[idx];
  var imgs = (it.imgs && it.imgs.length) ? it.imgs : [];
  state.detailIdx = 0;
  setView("view-item");
  $("item-title").textContent = node.name;
  $("back-item").style.display="inline";
  $("back-item").onclick = function(){ var self = "#/" + ids.join("/"); var p = state.prevHash || ""; location.hash = (p && p !== self) ? p : self; };
  $("back-all").style.display="none";
  /* 1:1 主图轮播（最多10张，箭头切换） */
  var trackHtml = "";
  imgs.forEach(function(u){ trackHtml += '<img loading="lazy" src="'+u+'" alt="主图">'; });
  $("mimg-track").innerHTML = trackHtml;
  var dotsHtml = "";
  for(var k=0;k<imgs.length;k++){ dotsHtml += '<i'+(k===0?" class=\"on\"":"")+'></i>'; }
  $("mimg-dots").innerHTML = dotsHtml;
  $("mimg-track").style.transform = "translateX(0)";
  mi.idx = 0; mi.total = imgs.length;
  $("mprev").style.display = imgs.length > 1 ? "flex" : "none";
  $("mnext").style.display = imgs.length > 1 ? "flex" : "none";
  $("mimg-dots").style.display = imgs.length > 1 ? "flex" : "none";
  $("mprev").onclick = function(){ miGo(mi.idx - 1); };
  $("mnext").onclick = function(){ miGo(mi.idx + 1); };
  $("mimg-track").onclick = function(e){ if(e.target.tagName==="IMG") openLightbox(e.target.getAttribute("src"), it.name); };
  $("detail-name").textContent = it.name;
  $("detail-desc").textContent = it.desc || "";
  /* 成分（空的自动隐藏） */
  $("detail-fabric").innerHTML = (it.fabric && String(it.fabric).trim()) ? '<b>成分：</b>' + esc(it.fabric) : "";
  /* 3个说明点（空的自动隐藏） */
  var pts = (it.points||[]).filter(function(p){ return p && String(p).trim(); });
  var ph = "";
  pts.forEach(function(p){ ph += '<div class="d-point"><i>◆</i><span>'+esc(p)+'</span></div>'; });
  $("detail-points").innerHTML = ph;
  /* 图文详情块（淘宝详情式） */
  var bh = "";
  (it.detailBlocks||[]).forEach(function(b){
    if(b.type === "text" && b.text){ bh += '<p class="d-block-text">'+esc(b.text)+'</p>'; }
    else if(b.type === "img" && b.url){ bh += '<img class="d-block-img" loading="lazy" src="'+b.url+'" alt="详情图">'; }
  });
  $("detail-blocks").innerHTML = bh;
  $("detail-blocks").onclick = function(e){
    var t = e.target.closest ? e.target.closest("img") : null;
    if(t && t.getAttribute("src")) openLightbox(t.getAttribute("src"), it.name);
  };
  $("back-list").style.display="none";
  renderContact("item-contact");
  $("fav-btn").style.display = "flex";
  $("fav-btn").onclick = favToggle;
  refreshFavBtn();
}
/* ---- 搜索结果页 ---- */
function showSearch(q){
  setView("view-search");
  $("back-search").style.display = "inline";
  $("back-search").onclick = function(){ location.hash = "#/"; };
  $("back-item").style.display="none";
  $("back-all").style.display="none";
  $("search-title").textContent = "搜索：" + q;
  var out = [];
  (function walk(list, path){
    list.forEach(function(n){
      var p = path + "/" + n.id;
      (n.items||[]).forEach(function(it, i){
        var hay = (it.name||"") + " " + (it.desc||"") + " " + (it.points||[]).join(" ");
        if(hay.indexOf(q) >= 0){ out.push({ name: it.name, hash: "#/" + p + "/" + i, img: itemImg(it), desc: it.desc || "", fabric: it.fabric || "" }); }
      });
      if(n.children) walk(n.children, p);
    });
  })(CATS, "");
  $("search-sub").textContent = "共 " + out.length + " 个结果";
  var gh = "";
  out.forEach(function(r){
    gh += '<div class="grid-card" onclick="location.hash=\''+r.hash+'\'">'
      + '<img loading="lazy" src="'+r.img+'" alt="'+esc(r.name)+'">'
      + '<div class="gc-name">'+esc(r.name)+'</div>'
      + '<div class="gc-desc">'+esc(r.desc)+'</div>'
      + (r.fabric ? '<div class="gc-fabric">成分：'+esc(r.fabric)+'</div>' : "")
      + '</div>';
  });
  $("sgrid").innerHTML = gh || '<div style="padding:30px 16px;text-align:center;color:#999;font-size:14px;">没有找到相关产品，换个关键词试试</div>';
}
/* ---- 收藏夹（本地存储：保存在本浏览器，无需登录） ---- */
var FAV_KEY = "album_favs_v1";
var favSet = {}, favCount = 0;
function loadFavs(){
  favSet = {}; favCount = 0;
  try{
    var raw = localStorage.getItem(FAV_KEY);
    if(raw){
      var arr = JSON.parse(raw) || [];
      arr.forEach(function(d){ if(d && d.itemId) favSet[d.itemId] = d; });
      favCount = arr.length;
    }
  }catch(e){}
  refreshFavBtn();
}
function saveFavs(){
  try{
    var arr = Object.keys(favSet).map(function(k){ return favSet[k]; });
    localStorage.setItem(FAV_KEY, JSON.stringify(arr));
  }catch(e){}
}
function curItem(){
  var node = findNode(state.path);
  if(!node || !node.items || state.idx == null) return null;
  return node.items[state.idx];
}
function itemId(it){ return it.id || ("it_" + state.path.join("/") + "_" + state.idx); }
var idMap = {};
var pathKeyMap = {};
(function walk(ns, path){
  ns.forEach(function(n){
    var p = path.concat([n.id]);
    (n.items||[]).forEach(function(it, i){
      if(it.id) idMap[it.id] = { it: it, path: p, idx: i };
      pathKeyMap["it_" + p.join("/") + "_" + i] = { it: it, path: p, idx: i };
    });
    if(n.children) walk(n.children, p);
  });
})(CATS, []);
function favBtnHtml(id){
  var on = !!favSet[id];
  return '<svg viewBox="0 0 24 24" width="26" height="26"><path d="M12 21s-7.5-4.6-9.7-9.2C.5 8.4 2.4 4.8 6 4.8c2 0 3.3 1 4.2 2.3h3.6C14.7 5.8 16 4.8 18 4.8c3.6 0 5.5 3.6 3.7 7C19.5 16.4 12 21 12 21z" fill="'+(on?"#e8590c":"rgba(255,255,255,.92)")+'" stroke="'+(on?"#e8590c":"#555")+'" stroke-width="1.2"/></svg>';
}
function refreshFavBtn(){
  var b = $("fav-btn");
  if(!b) return;
  var it = curItem();
  var id = it ? itemId(it) : "";
  b.innerHTML = favBtnHtml(id);
}
function showFavTip(msg){
  var t = $("fav-tip");
  if(!t) return;
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(function(){ t.classList.remove("show"); }, 1600);
}
function favToggle(){
  var it = curItem();
  if(!it) return;
  var id = itemId(it);
  if(favSet[id]) favRemove(id);
  else favAdd(id, it);
}
function favAdd(id, it){
  favSet[id] = { itemId: id, name: it.name || "", time: Date.now() };
  favCount = Object.keys(favSet).length;
  saveFavs();
  refreshFavBtn();
  showFavTip("已收藏，本浏览器刷新后仍可见");
}
function favRemove(id){
  delete favSet[id];
  favCount = Object.keys(favSet).length;
  saveFavs();
  refreshFavBtn();
  showFavTip("已取消收藏");
}
function showFav(){
  setView("view-fav");
  $("back-fav").style.display = "inline";
  $("back-fav").onclick = function(){ var p = state.prevHash || ""; location.hash = (p && p.indexOf("#/fav") !== 0) ? p : "#/"; };
  $("back-item").style.display = "none";
  $("back-all").style.display = "none";
  $("fav-sub").textContent = "收藏保存在本浏览器，换设备或清缓存会清空";
  var box = $("fav-grid");
  var gh = "";
  var list = Object.keys(favSet).map(function(k){ return favSet[k]; }).sort(function(a, b){ return (b.time||0) - (a.time||0); });
  list.forEach(function(d){
    var r = idMap[d.itemId] || pathKeyMap[d.itemId];
    if(!r) return;
    gh += '<div class="grid-card" onclick="location.hash=\'#/'+r.path.join("/")+'/'+r.idx+'\'">'
      + '<img loading="lazy" src="'+itemImg(r.it)+'" alt="'+esc(r.it.name)+'">'
      + '<div class="gc-name">'+esc(r.it.name)+'</div>'
      + ((r.it.fabric && String(r.it.fabric).trim()) ? '<div class="gc-fabric">成分：'+esc(r.it.fabric)+'</div>' : "")
      + '</div>';
  });
  box.innerHTML = gh || '<div class="fav-empty">还没有收藏的产品<br>逛一逛，在详情页点心形即可收藏</div>';
}
loadFavs();
/* ---- 底部导航栏激活态 ---- */
function setTabbar(h){
  h = h || "#/";
  var on = (h === "#" || h === "#/") ? "tab-home" : (h.indexOf("#/all") === 0 ? "tab-cat" : (h.indexOf("#/fav") === 0 ? "tab-fav" : ""));
  ["tab-home","tab-cat","tab-fav"].forEach(function(id){
    var el = $(id);
    if(el) el.classList.toggle("on", id === on);
  });
}
/* ---- 路由 ---- */
function route(){
  setTabbar(location.hash || "#/");
  var h2 = (location.hash || "#/").replace(/^#/, "");
  var parts = h2.split("/").filter(Boolean);
  if(parts.length === 0){ showHome(); return; }
  if(parts[0] === "all"){ showAll(); return; }
  if(parts[0] === "fav"){ showFav(); return; }
  if(parts[0] === "search"){ showSearch(decodeURIComponent(parts.slice(1).join("/")) || ""); return; }
  var last = parts[parts.length-1];
  if(/^\d+$/.test(last)){
    var ids = parts.slice(0, -1);
    var node = findNode(ids);
    if(node && node.items && node.items[+last]){ showItem(ids, +last); }
    else { showHome(); }
  } else {
    var node2 = findNode(parts);
    if(node2){ showList(parts); }
    else { showHome(); }
  }
}
/* ---- 放大弹层 ---- */
var lb = { scale:1, tx:0, ty:0, pinch:0, moving:false };
function lbApply(){ var img=$("lb-img"); img.style.transition="transform .18s ease"; img.style.transform="translate("+lb.tx+"px,"+lb.ty+"px) scale("+lb.scale+")"; }
function lbReset(){ lb.scale=1; lb.tx=0; lb.ty=0; lbApply(); }
function lbZoom(scale,cx,cy){ var img=$("lb-img"); var r=img.getBoundingClientRect(); var pcx=(cx-(r.left+r.width/2))/lb.scale; var pcy=(cy-(r.top+r.height/2))/lb.scale; lb.scale=Math.max(1,Math.min(5,scale)); lb.tx=(cx-r.left-r.width/2)-pcx*lb.scale; lb.ty=(cy-r.top-r.height/2)-pcy*lb.scale; lbApply(); }
function openLightbox(img,name){ $("lb-img").src=img; $("lb-name").textContent=name||""; $("lightbox").classList.add("show"); lbReset(); }
function closeLightbox(){ $("lightbox").classList.remove("show"); lbReset(); }
(function(){
  var stage=$("lb-stage"), img=$("lb-img");
  var t0=null, dist0=0, lastScale=1, lastTx=0, lastTy=0;
  stage.addEventListener("touchstart", function(e){
    if(e.touches.length===1){ t0={x:e.touches[0].clientX,y:e.touches[0].clientY,t:Date.now()}; lastTx=lb.tx; lastTy=lb.ty; lb.moving=false; }
    else if(e.touches.length===2){ t0=null; var dx=e.touches[0].clientX-e.touches[1].clientX; var dy=e.touches[0].clientY-e.touches[1].clientY; dist0=Math.sqrt(dx*dx+dy*dy); lastScale=lb.scale; lb.pinch=1; img.style.transition="none"; }
  }, {passive:false});
  stage.addEventListener("touchmove", function(e){
    e.preventDefault();
    if(e.touches.length===2){ var dx=e.touches[0].clientX-e.touches[1].clientX; var dy=e.touches[0].clientY-e.touches[1].clientY; var d=Math.sqrt(dx*dx+dy*dy); if(dist0>0){ var ns=lastScale*(d/dist0); ns=Math.max(1,Math.min(5,ns)); lb.scale=ns; lbApply(); img.style.transition="none"; } lb.pinch=1; }
    else if(e.touches.length===1){
      if(lb.pinch){ lb.pinch=0; lastTx=lb.tx; lastTy=lb.ty; t0={x:e.touches[0].clientX,y:e.touches[0].clientY,t:Date.now()}; }
      if(t0){ var nx=e.touches[0].clientX-t0.x; var ny=e.touches[0].clientY-t0.y; if(Math.abs(nx)>6||Math.abs(ny)>6) lb.moving=true; if(lb.scale>1){ lb.tx=lastTx+nx; lb.ty=lastTy+ny; lbApply(); } }
    }
  }, {passive:false});
  stage.addEventListener("touchend", function(e){
    if(e.touches.length===0 && t0 && !lb.moving && lb.pinch===0){ if(Date.now()-t0.t<350){ if(lb.scale>1.05){ lbReset(); } else { lbZoom(2.6,t0.x,t0.y); } } }
    if(e.touches.length===0){ t0=null; lb.pinch=0; }
  });
  stage.addEventListener("dblclick", function(e){ if(lb.scale>1.05){ lbReset(); } else { lbZoom(2.6,e.clientX,e.clientY); } });
})();
/* ---- 轮播按钮与滑动 ---- */
$("sw-prev").onclick = function(){ swGo(sw.idx-1); };
$("sw-next").onclick = function(){ swGo(sw.idx+1); };
(function(){
  var el = $("swiper");
  el.addEventListener("touchstart", function(e){ sw.startX = e.touches[0].clientX; if(sw.timer) clearInterval(sw.timer); }, {passive:true});
  el.addEventListener("touchend", function(e){
    var dx = e.changedTouches[0].clientX - sw.startX;
    if(Math.abs(dx) > 40){ if(dx < 0) swGo(sw.idx+1); else swGo(sw.idx-1); }
    swStart();
  }, {passive:true});
})();
function init(){
  $("back-list").onclick = function(){ location.hash = "#/"; };
  $("lb-close").onclick = closeLightbox;
  $("lb-stage").onclick = function(e){ if(e.target===this || e.target.id==="lb-stage") closeLightbox(); };
  $("back-top").onclick = function(){ window.scrollTo(0, 0); };
  window.addEventListener("scroll", function(){ $("back-top").style.display = (window.pageYOffset > 400) ? "flex" : "none"; }, {passive:true});
  window.addEventListener("hashchange", function(){ state.prevHash = state.curHash || location.hash; state.curHash = location.hash; route(); });
  document.addEventListener("error", function(e){ var t = e.target; if(t && t.tagName === "IMG" && t.src && t.src.indexOf("data:") !== 0){ t.src = PLACEHOLDER; } }, true);
  state.curHash = location.hash;
  route();
}
init();
</script>
